apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: app-dep-alertconfig
  namespace: myapp
  labels:
    release: monitoring
spec:
  route:
    receiver: slack-and-email
    groupBy: ["alertname"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
  receivers:
    - name: slack-and-email
      slackConfigs:
        - apiURL:
            name: slack-webhook-secret
            key: url
          channel: "#all-myapp"
          sendResolved: true
      emailConfigs:
        - to: neerajbijalwan96@gmail.com
          from: neerajbijalwan96@gmail.com
          smarthost: smtp.gmail.com:587
          authUsername: neerajbijalwan96@gmail.com
          authIdentity: neerajbijalwan96@gmail.com
          authPassword:
            name: smtp-secret
            key: password
          requireTLS: true
          sendResolved: true
