# used in solo project or small team
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: app-dep-alertconfig
  namespace: myapp
  labels:
    release: monitoring # same label rule you just learned — required to be picked up
spec:
  route:
    receiver: slack-notifications
    groupBy: ["alertname"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
  receivers:
    - name: slack-notifications
      slackConfigs:
        - apiURL:
            name: slack-webhook-secret
            key: url
          channel: "#alerts"
          sendResolved: true
