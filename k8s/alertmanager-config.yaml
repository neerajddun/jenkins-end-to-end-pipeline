apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: app-dep-alertconfig
  namespace: myapp
  labels:
    release: monitoring
spec:
  route:
    receiver: slack
    groupBy: ["alertname"]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
  receivers:
    - name: slack
      slackConfigs:
        - apiURL:
            name: slack-webhook-secret
            key: url
          channel: "#all-myapp"
          sendResolved: true
