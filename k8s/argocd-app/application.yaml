apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-app-config
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/neerajddun/jenkins-end-to-end-pipeline.git
    targetRevision: master
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: myapp

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
