apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-dep
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-dep
  template:
    metadata:
      labels:
        app: app-dep
    spec:
      containers:
        - name: app-dep
          image: 883999921903.dkr.ecr.ap-southeast-1.amazonaws.com/my-repo:v1.14
          ports:
            - containerPort: 8080
